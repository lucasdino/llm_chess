### model
model_name_or_path: Qwen/Qwen2.5-0.5B-Instruct
trust_remote_code: true

### method
stage: sft
do_train: true
finetuning_type: full
# deepspeed: tasks/training_configs/ds_z3_config.json
push_to_hub: false

### dataset
dataset: llmchess_programmatic
dataset_dir: data/train_data/infodensity_vabp
template: default
cutoff_len: 1536
overwrite_cache: true

### output
output_dir: eval_logits/q25_05b_infodensity_vabp_v2
logging_steps: 10
save_strategy: "no"
skip_final_model_save: true
overwrite_output_dir: true

### train
per_device_train_batch_size: 8
gradient_accumulation_steps: 1
learning_rate: 3.0e-6
lr_scheduler_type: cosine
warmup_ratio: 0.1
num_train_epochs: 2.0
bf16: true
ddp_timeout: 180000000

### reporting
report_to: wandb
group_name: vabp
run_name: q25_05b_infodensity_vabp_v2

### eval
do_eval: true
val_size: 0.05
per_device_eval_batch_size: 8
eval_strategy: "no"
run_initial_eval: true
eval_tokens: 1000000
save_eval_token_logits: true